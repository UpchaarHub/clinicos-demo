<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ClinicOS — Clinic & Hospital Management</title>
<style>
:root{
  --teal:#0d9488; --teal-dark:#0b7c72; --teal-light:#e6f7f5;
  --bg:#f2f6f6; --card:#ffffff; --ink:#14332f; --muted:#5f716e;
  --line:#e2eae9; --danger:#dc2626; --amber:#b45309; --amber-bg:#fef3e2;
  --green:#15803d; --green-bg:#e9f7ee; --red-bg:#fdecec;
  --radius:14px; --shadow:0 2px 10px rgba(20,51,47,.07);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:var(--font); background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;}
h1,h2,h3{margin:0 0 .5em;}
p{margin:.4em 0;}
button{font-family:var(--font);}

/* ---------- Login ---------- */
#loginView{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:linear-gradient(160deg,#0d9488 0%,#0a5f59 100%);}
.login-card{background:#fff; border-radius:20px; padding:28px 24px; width:100%; max-width:400px; box-shadow:0 12px 40px rgba(0,0,0,.25);}
.login-card .brand{text-align:center; margin-bottom:18px;}
.brand-mark{width:56px;height:56px;border-radius:16px;background:var(--teal);color:#fff;display:inline-flex;
  align-items:center;justify-content:center;font-size:28px;font-weight:800;}
.brand h1{font-size:24px; margin:.4em 0 .1em;}
.brand p{color:var(--muted); font-size:13px; margin:0;}
.demo-banner{background:#fff8e6;border:1px solid #f0dfae;color:#8a6d1a;border-radius:10px;padding:8px 12px;
  font-size:12.5px;margin-bottom:14px;text-align:center;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-size:15px;font-family:var(--font);background:#fff;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);}
.role-pick{display:flex;gap:10px;}
.role-opt{flex:1;border:2px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;background:#fff;}
.role-opt.sel{border-color:var(--teal);background:var(--teal-light);}
.role-opt .ic{font-size:24px;}
.role-opt .t{font-weight:700;font-size:14px;margin-top:4px;}
.btn{display:inline-block;border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;
  background:var(--teal);color:#fff;width:100%;}
.btn:active{transform:scale(.98);}
.btn.secondary{background:#fff;color:var(--teal);border:1.5px solid var(--teal);}
.btn.ghost{background:#eef4f3;color:var(--ink);}
.btn.danger{background:var(--danger);}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:9px;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- App shell ---------- */
#appView{display:none; min-height:100vh;}
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:10px;}
.topbar .bmark{width:34px;height:34px;border-radius:10px;background:var(--teal);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:17px;}
.topbar .clinic{font-weight:800;font-size:14.5px;line-height:1.2;}
.topbar .clinic small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;}
.topbar .spacer{flex:1;}
.role-badge{font-size:11.5px;font-weight:700;background:var(--teal-light);color:var(--teal-dark);
  padding:5px 10px;border-radius:20px;white-space:nowrap;}
.layout{display:flex; max-width:1200px; margin:0 auto;}
.sidebar{width:220px;flex-shrink:0;padding:16px 0 16px 16px;display:block;}
.nav{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:8px;position:sticky;top:76px;}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;
  padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;}
.nav button .ic{font-size:17px;width:22px;text-align:center;}
.nav button.active{background:var(--teal-light);color:var(--teal-dark);}
.nav .sec{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
  padding:10px 12px 4px;}
.main{flex:1;padding:16px;min-width:0;}
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.pagehead h2{font-size:20px;margin:0;flex:1;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.stat{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;}
.stat .v{font-size:24px;font-weight:800;color:var(--teal-dark);}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* ---------- Queue / lists ---------- */
.token{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
  padding:12px 14px;margin-bottom:10px;}
.token .num{width:46px;height:46px;border-radius:12px;background:var(--teal-light);color:var(--teal-dark);
  font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.pill.waiting{background:#fff7e6;color:#a16207;}
.pill.in-consultation{background:#e0f2ff;color:#0369a1;}
.pill.done{background:var(--green-bg);color:var(--green);}
.token .who{flex:1;min-width:0;}
.token .who .nm{font-weight:700;}
.token .who .sub{font-size:12px;color:var(--muted);}
.prow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.prow:last-child{border-bottom:none;}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--teal-light);color:var(--teal-dark);
  display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.prow .who{flex:1;min-width:0;}
.prow .nm{font-weight:700;}
.prow .sub{font-size:12px;color:var(--muted);}
.tag{display:inline-block;font-size:11px;font-weight:700;background:#fff1f1;color:var(--danger);
  border-radius:6px;padding:2px 7px;margin-right:4px;}
.tag.chronic{background:#eef4ff;color:#1d4ed8;}
.timeline{border-left:2px solid var(--line);margin:8px 0 0 6px;padding-left:16px;}
.tl-item{position:relative;padding-bottom:14px;}
.tl-item:before{content:"";position:absolute;left:-22.5px;top:4px;width:11px;height:11px;border-radius:50%;
  background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 2px var(--teal-light);}
.tl-item .dt{font-size:11.5px;color:var(--muted);font-weight:700;}
.warn{background:var(--red-bg);border:1px solid #f5c6c6;color:#991b1b;border-radius:10px;padding:10px 12px;
  font-size:13px;margin:8px 0;}
.warn.amber{background:var(--amber-bg);border-color:#f0dcb4;color:#92400e;}
.notice{background:#eef6ff;border:1px solid #cfe4fb;color:#1e40af;border-radius:10px;padding:10px 12px;
  font-size:13px;margin:8px 0;}

/* ---------- Modal / toast / misc ---------- */
.modal-veil{position:fixed;inset:0;background:rgba(10,30,28,.5);display:none;align-items:flex-end;justify-content:center;z-index:100;}
.modal-veil.open{display:flex;}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px;}
.modal h3{margin-top:0;}
#toasts{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:#14332f;color:#fff;padding:10px 18px;border-radius:24px;font-size:13.5px;font-weight:600;
  box-shadow:0 4px 16px rgba(0,0,0,.25);animation:tin .25s ease;}
@keyframes tin{from{opacity:0;transform:translateY(8px);}to{opacity:1;}}
table.log{width:100%;border-collapse:collapse;font-size:13px;}
table.log th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  padding:8px;border-bottom:1px solid var(--line);}
table.log td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;}
.consent-box{background:#f8faf9;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;
  color:var(--muted);margin:8px 0;}
.consent-box label{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:13.5px;font-weight:600;}
.agentrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.agentrow:last-child{border:none;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 0 3px var(--green-bg);}
.dot.off{background:#9aa5a3;box-shadow:none;}
.phase-tag{font-size:10.5px;font-weight:800;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:3px 8px;
  text-transform:uppercase;letter-spacing:.05em;}
.placeholder{text-align:center;padding:44px 20px;color:var(--muted);}
.placeholder .big{font-size:44px;margin-bottom:8px;}
.placeholder h3{color:var(--ink);}

/* ---------- Bottom nav (mobile) ---------- */
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.bottomnav .row{display:flex;}
.bottomnav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10px;font-weight:700;color:var(--muted);padding:6px 2px;cursor:pointer;}
.bottomnav button .ic{font-size:20px;}
.bottomnav button.active{color:var(--teal-dark);}
.sheet-veil{position:fixed;inset:0;background:rgba(10,30,28,.5);display:none;z-index:90;}
.sheet-veil.open{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;z-index:95;
  padding:12px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;
  max-height:70vh;overflow:auto;}
.sheet.open{transform:translateY(0);}
.sheet button.mi{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;text-align:left;
  padding:13px 8px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink);}
.sheet button.mi .ic{font-size:19px;width:24px;}

@media (max-width:820px){
  .sidebar{display:none;}
  .bottomnav{display:block;}
  .main{padding:12px 12px 96px;}
  .stats{grid-template-columns:repeat(2,1fr);}
  .grid2{grid-template-columns:1fr;}
  .modal-veil{align-items:flex-end;}
}
@media (min-width:821px){
  .modal-veil{align-items:center;justify-content:center;}
  .modal{border-radius:18px;}
}
@media print{
  .topbar,.sidebar,.bottomnav,.btnrow,.no-print{display:none !important;}
  body{background:#fff;}
  .card{box-shadow:none;border:1px solid #ddd;}
}
</style>
</head>

<!-- ============ LOGIN ============ -->
<div id="loginView">

      <div class="brand-mark">+</div>
      <h1>ClinicOS</h1>
      <p>AI-powered clinic &amp; hospital management</p>
    </div>
    <div class="demo-banner">Demo build &mdash; sample data only. Nothing leaves this device.</div>
    <div class="field">
      <label>I am a</label>
      <div class="role-pick">
        <div class="role-opt sel" id="roleDoctor" onclick="pickRole('doctor')">
          <div class="ic">&#x1F468;&#x200D;&#x2695;&#xFE0F;</div><div class="t">Doctor</div>
        </div>
        <div class="role-opt" id="roleRecep" onclick="pickRole('receptionist')">

      Role-based access &bull; every action is audit-logged

  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appView">

  <div class="layout">

  <div class="bottomnav"><div class="row" id="bottomNav"></div></div>
  <div class="sheet-veil" id="sheetVeil" onclick="closeSheet()"></div>
  <div class="sheet" id="moreSheet"></div>
</div>

<div class="modal-veil" id="modalVeil" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>
<div id="toasts"></div>

/* ---------------- Data layer ---------------- */
let DB=null;
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){} }
function load(){
  try{ const raw=localStorage.getItem(DB_KEY); if(raw){ DB=JSON.parse(raw); return; } }catch(e){}
  DB=seedData(); save();
}
function audit(action, entity){
  DB.auditLog.unshift({ts:nowStr(), user:DB.session?DB.session.role:"system",
    role:DB.session?DB.session.role:"-", action, entity:entity||"-"});
  if(DB.auditLog.length>300) DB.auditLog.length=300;
}
function nowStr(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function todayStr(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()}`; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function inr(n){ return "₹"+Number(n).toLocaleString("en-IN"); }
function patientById(id){ return DB.patients.find(p=>p.id===id); }
function branchTokens(bid){ return DB.tokens.filter(t=>t.branchId===bid).sort((a,b)=>a.num-b.num); }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.getElementById("toasts").appendChild(t); setTimeout(()=>t.remove(),2400); }
function openModal(html){ document.getElementById("modalBox").innerHTML=html;
  document.getElementById("modalVeil").classList.add("open"); }
function closeModal(){ document.getElementById("modalVeil").classList.remove("open"); }

/* ---------------- Queue ---------------- */
function vQueue(v){
  const bid=DB.session.branchId, toks=branchTokens(bid);
  const eta=i=>Math.max(0,(i)*AVG_CONSULT_MIN);
  let wi=0;
  const rows=toks.map(t=>{const p=patientById(t.patientId);
    const w=t.status==="waiting"?`<span class="sub"> · ~${eta(wi++)} min wait</span>`:"";
    return `<div class="token"><div class="num">${t.num}</div>
    <div class="who"><div class="nm">${esc(p.name)} <span class="sub">${p.age}${p.sex}</span></div>
      <div class="sub">${esc(p.village)} · ${t.type}${w}</div></div>
    <span class="pill ${t.status}">${t.status.replace("-"," ")}</span>
    <div class="btnrow">
      ${t.status==="waiting"?`<button class="btn sm" onclick="callNext('${t.id}')">Call</button>`:""}
      ${t.status==="in-consultation"?`<button class="btn sm secondary" onclick="toast('Consult arrives in Phase 2')">Consult</button>`:""}
      ${t.status!=="done"?`<button class="btn sm ghost" onclick="doneToken('${t.id}')">Done</button>`:""}
    </div></div>`;}).join("");
  v.innerHTML=`<div class="pagehead"><h2>Token queue</h2>
    <button class="btn sm" onclick="addToken()">+ Walk-in token</button></div>
    ${rows||'<div class="card"><p style="color:var(--muted)">No tokens yet today.</p></div>'}
    <div class="notice">Queue Optimizer estimates ~${AVG_CONSULT_MIN} min per consultation and updates ETAs live.</div>`;
}
function addToken(){
  const opts=DB.patients.map(p=>`<option value="${p.id}">${esc(p.name)} — ${p.age}${p.sex}, ${esc(p.village)}</option>`).join("");
  openModal(`<h3>New walk-in token</h3>
    <div class="field"><label>Patient</label><select id="ntP">${opts}</select></div>
    <div class="btnrow"><button class="btn" onclick="doAddToken()">Issue token</button>
    <button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
}
function doAddToken(){
  const bid=DB.session.branchId, pid=document.getElementById("ntP").value;
  const num=DB.tokenSeq[bid]++;
  const t={id:"t"+Date.now(),num,patientId:pid,branchId:bid,status:"waiting",type:"walk-in",arrived:0};
  DB.tokens.push(t); audit("Token issued","#"+num+" "+patientById(pid).name); save(); closeModal(); render();
  toast("Token #"+num+" issued — WhatsApp confirmation queued (demo)");
}
function callNext(id){ const t=DB.tokens.find(x=>x.id===id); if(!t) return;
  DB.tokens.forEach(x=>{ if(x.branchId===t.branchId&&x.status==="in-consultation") x.status="waiting"; });
  t.status="in-consultation"; audit("Token called","#"+t.num); save(); render();
  toast("Token #"+t.num+" called — patient notified on WhatsApp (demo)"); }
function doneToken(id){ const t=DB.tokens.find(x=>x.id===id); if(!t) return;
  t.status="done"; audit("Token completed","#"+t.num); save(); render(); }

  const p=patientById(id); if(!p) return;

      <div class="avatar" style="width:52px;height:52px;font-size:20px">${esc(p.name[0])}</div>

    </div>
    ${shared?'<div class="notice">Shared record — registered at another branch. One patient, one history.</div>':""}
    <div style="margin:8px 0">${p.allergies?`<span class="tag">⚠ Allergy: ${esc(p.allergies)}</span>`:""}
    ${(p.chronic||[]).map(c=>`<span class="tag chronic">${esc(c)}</span>`).join("")}</div>
    ${p.followUp?`<div class="warn amber">Follow-up due: ${esc(p.followUp)}</div>`:""}
    <h3>Visit history</h3>
    <div class="timeline">${vs.length?vs.map(x=>`
      <div class="tl-item"><div class="dt">${esc(x.date)} · ${esc(branchName(x.branchId))}</div>
      <b>${esc(x.diagnosis)}</b><div style="font-size:13px;color:var(--muted)">${esc(x.complaint)}</div>
      <div style="font-size:13px">Rx: ${esc(x.rx)}</div></div>`).join("")
      :'<p style="color:var(--muted);font-size:13px">No visits yet.</p>'}</div>
    <div class="consent-box">Consent recorded: ${esc(p.consentTs)} · withdrawable at clinic.</div>
    <div class="btnrow"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
}

/* ---------------- Data controls ---------------- */
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="clinicos-backup-"+todayStr()+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast("Backup downloaded");
}
function importData(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.patients||!d.branches) throw 0;
      DB=d; audit("Data imported","backup file"); save(); render(); toast("Backup restored");
    }catch(e){ toast("Invalid backup file"); } };
  r.readAsText(f); ev.target.value="";
}
function resetData(){ if(!confirm("Reset all demo data?")) return;
  const s=DB.session; DB=seedData(); DB.session=s; audit("Demo data reset",""); save(); render(); toast("Demo data reset"); }

/* ---------------- Init ---------------- */
load();
document.getElementById("loginBranch").innerHTML=
  DB.branches.map(b=>`<option value="${b.id}">${esc(b.name)} — ${esc(b.area)}</option>`).join("");
</script>
</body>
</html>
