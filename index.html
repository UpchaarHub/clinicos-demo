<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="ClinicOS demo — AI-powered clinic management: token queue, AI scribe, billing, WhatsApp reminders, branches, reports. Sample data only; runs fully on-device.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D9488'/%3E%3Cpath d='M32 18v28M18 32h28' stroke='white' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<title>ClinicOS — Clinic &amp; Hospital Management</title>
<style>
:root{
  --teal:#0d9488; --teal-dark:#0b7c72; --teal-light:#e6f7f5;
  --bg:#f2f6f6; --card:#ffffff; --ink:#14332f; --muted:#5f716e;
  --line:#e2eae9; --danger:#dc2626; --amber:#b45309; --amber-bg:#fef3e2;
  --green:#15803d; --green-bg:#e9f7ee; --red-bg:#fdecec;
  --info:#1e40af; --info-bg:#eef6ff; --info-line:#cfe4fb;
  --banner-bg:#fff8e6; --banner-line:#f0dfae; --banner-ink:#8a6d1a;
  --pill-wait-bg:#fff7e6; --pill-wait-ink:#a16207;
  --pill-prog-bg:#e0f2ff; --pill-prog-ink:#0369a1;
  --radius:14px; --shadow:0 2px 10px rgba(20,51,47,.07);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:var(--font); background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;}
h1,h2,h3{margin:0 0 .5em;}
h3{font-size:16px;}
p{margin:.4em 0;}
button{font-family:var(--font);}

/* ---------- Login ---------- */
#loginView{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:linear-gradient(160deg,#0d9488 0%,#0a5f59 100%);}
.login-card{background:#fff; border-radius:20px; padding:28px 24px; width:100%; max-width:400px; box-shadow:0 12px 40px rgba(0,0,0,.25);}
.login-card .brand{text-align:center; margin-bottom:18px;}
.brand-mark{width:56px;height:56px;border-radius:16px;background:var(--teal);color:#fff;display:inline-flex;
  align-items:center;justify-content:center;font-size:28px;font-weight:800;}
.brand h1{font-size:24px; margin:.4em 0 .1em;}
.brand p{color:var(--muted); font-size:13px; margin:0;}
.demo-banner{background:var(--banner-bg);border:1px solid var(--banner-line);color:var(--banner-ink);border-radius:10px;padding:8px 12px;
  font-size:12.5px;margin-bottom:14px;text-align:center;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-size:15px;font-family:var(--font);background:#fff;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);}
.field input.invalid,.field select.invalid,.field textarea.invalid{border-color:var(--danger);}
.err{color:var(--danger);font-size:12.5px;font-weight:600;margin-top:6px;}
.role-pick{display:flex;gap:10px;}
.role-opt{flex:1;border:2px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;background:#fff;
  font-family:var(--font);color:var(--ink);font-size:15px;}
.role-opt:hover{border-color:var(--teal);}
.role-opt.sel{border-color:var(--teal);background:var(--teal-light);}
.role-opt .ic{font-size:24px;}
.role-opt .t{font-weight:700;font-size:14px;margin-top:4px;}
.btn{display:inline-block;border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;
  background:var(--teal);color:#fff;width:100%;}
.btn:active{transform:scale(.98);}
.btn:hover{filter:brightness(.94);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--teal);outline-offset:2px;}
.btn.secondary{background:#fff;color:var(--teal);border:1.5px solid var(--teal);}
.btn.ghost{background:#eef4f3;color:var(--ink);}
.btn.danger{background:var(--danger);}
.btn.sm{padding:10px 14px;font-size:13px;width:auto;border-radius:9px;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- App shell ---------- */
#appView{display:none; min-height:100vh;}
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:10px;}
.topbar .bmark{width:34px;height:34px;border-radius:10px;background:var(--teal);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:17px;}
.topbar .clinic{font-weight:800;font-size:14.5px;line-height:1.2;}
.topbar .clinic small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;}
.topbar .spacer{flex:1;}
.role-badge{font-size:11.5px;font-weight:700;background:var(--teal-light);color:var(--teal-dark);
  padding:5px 10px;border-radius:20px;white-space:nowrap;}
.layout{display:flex; max-width:1200px; margin:0 auto;}
.sidebar{width:220px;flex-shrink:0;padding:16px 0 16px 16px;display:block;}
.nav{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:8px;position:sticky;top:76px;}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;
  padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;}
.nav button .ic{font-size:17px;width:22px;text-align:center;}
.nav button.active{background:var(--teal-light);color:var(--teal-dark);}
.nav button:hover{background:#f0f7f6;}
.nav button.active:hover{background:var(--teal-light);}
.nav button:active{transform:scale(.98);}
.nav .sec{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
  padding:10px 12px 4px;}
.main{flex:1;padding:16px;min-width:0;}
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.pagehead h2{font-size:20px;margin:0;flex:1;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.stat{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;}
.stat .v{font-size:24px;font-weight:800;color:var(--teal-dark);}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* ---------- Queue / lists ---------- */
.token{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
  padding:12px 14px;margin-bottom:10px;}
.token .num{width:46px;height:46px;border-radius:12px;background:var(--teal-light);color:var(--teal-dark);
  font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.pill.waiting{background:var(--pill-wait-bg);color:var(--pill-wait-ink);}
.pill.in-consultation{background:var(--pill-prog-bg);color:var(--pill-prog-ink);}
.pill.done{background:var(--green-bg);color:var(--green);}
.token .who{flex:1;min-width:0;}
.token .who .nm{font-weight:700;}
.token .who .sub{font-size:12px;color:var(--muted);}
.prow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.prow[data-kb]:hover{background:#f7fbfa;}
.prow:last-child{border-bottom:none;}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--teal-light);color:var(--teal-dark);
  display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.prow .who{flex:1;min-width:0;}
.prow .nm{font-weight:700;}
.prow .sub{font-size:12px;color:var(--muted);}
.tag{display:inline-block;font-size:11px;font-weight:700;background:#fff1f1;color:var(--danger);
  border-radius:6px;padding:2px 7px;margin-right:4px;}
.tag.chronic{background:var(--info-bg);color:var(--info);}
.timeline{border-left:2px solid var(--line);margin:8px 0 0 6px;padding-left:16px;}
.tl-item{position:relative;padding-bottom:14px;}
.tl-item:before{content:"";position:absolute;left:-22.5px;top:4px;width:11px;height:11px;border-radius:50%;
  background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 2px var(--teal-light);}
.tl-item .dt{font-size:11.5px;color:var(--muted);font-weight:700;}
.warn{background:var(--red-bg);border:1px solid #f5c6c6;color:#991b1b;border-radius:10px;padding:10px 12px;
  font-size:13px;margin:8px 0;}
.warn.amber{background:var(--amber-bg);border-color:#f0dcb4;color:#92400e;}
.notice{background:var(--info-bg);border:1px solid var(--info-line);color:var(--info);border-radius:10px;padding:10px 12px;
  font-size:13px;margin:8px 0;}

/* ---------- Modal / toast / misc ---------- */
.modal-veil{position:fixed;inset:0;background:rgba(10,30,28,.5);display:none;align-items:flex-end;justify-content:center;z-index:100;}
.modal-veil.open{display:flex;}
.modal-veil.open .modal{animation:mpop .2s ease;}
@keyframes mpop{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
#view.vin{animation:viewin .15s ease;}
@keyframes viewin{from{opacity:.35;}to{opacity:1;}}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px;}
.modal h3{margin-top:0;}
#toasts{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:#14332f;color:#fff;padding:10px 18px;border-radius:24px;font-size:13.5px;font-weight:600;
  box-shadow:0 4px 16px rgba(0,0,0,.25);animation:tin .25s ease;}
@keyframes tin{from{opacity:0;transform:translateY(8px);}to{opacity:1;}}
table.log{width:100%;border-collapse:collapse;font-size:13px;}
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px;}
.tablewrap table.log{min-width:520px;}
table.log th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  padding:8px;border-bottom:1px solid var(--line);}
table.log td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;}
.consent-box{background:#f8faf9;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;
  color:var(--muted);margin:8px 0;}
.consent-box label{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:13.5px;font-weight:600;}
.agentrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.agentrow:last-child{border:none;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 0 3px var(--green-bg);}
.dot.off{background:#9aa5a3;box-shadow:none;}
.placeholder{text-align:center;padding:44px 20px;color:var(--muted);}
.placeholder .big{font-size:44px;margin-bottom:8px;}
.placeholder h3{color:var(--ink);}

/* ---------- Phase 3/4 additions ---------- */
.wa-phone{width:300px;max-width:100%;background:#0b141a;border-radius:26px;padding:12px;box-shadow:var(--shadow);margin:0 auto;}
.wa-screen{background:#e5ddd2;border-radius:16px;padding:14px 10px;min-height:300px;display:flex;flex-direction:column;gap:8px;}
.wa-bub{max-width:88%;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;
  background:#fff;align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.15);}
.wa-bub.out{background:#d9fdd3;align-self:flex-end;}
.wa-meta{text-align:right;font-size:10.5px;color:#667781;margin-top:5px;}
.tgl{width:48px;height:27px;border-radius:14px;background:#b9c4c2;border:none;position:relative;cursor:pointer;flex-shrink:0;}
.tgl.on{background:var(--teal);}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s;}
.tgl.on:after{left:24px;}

/* ---------- Bottom nav (mobile) ---------- */
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.bottomnav .row{display:flex;}
.bottomnav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10px;font-weight:700;color:var(--muted);padding:6px 2px;cursor:pointer;}
.bottomnav button .ic{font-size:20px;}
.bottomnav button.active{color:var(--teal-dark);}
.bottomnav button:hover{background:#f4faf9;}
.sheet-veil{position:fixed;inset:0;background:rgba(10,30,28,.5);display:none;z-index:90;}
.sheet-veil.open{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;z-index:95;
  padding:12px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;
  max-height:70vh;overflow:auto;}
.sheet.open{transform:translateY(0);}
.sheet button.mi{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;text-align:left;
  padding:13px 8px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink);}
.sheet button.mi .ic{font-size:19px;width:24px;}
.sheet button.mi:hover{background:#f7fbfa;}

@media (max-width:820px){
  .sidebar{display:none;}
  .bottomnav{display:block;}
  .main{padding:12px 12px 96px;}
  .stats{grid-template-columns:repeat(2,1fr);}
  .grid2{grid-template-columns:1fr;}
  .modal-veil{align-items:flex-end;}
}
@media (min-width:821px){
  .modal-veil{align-items:center;justify-content:center;}
  .modal{border-radius:18px;}
}
@media print{
  .topbar,.sidebar,.bottomnav,.btnrow,.no-print{display:none !important;}
  body{background:#fff;}
  .card{box-shadow:none;border:1px solid #ddd;}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginView">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">+</div>
      <h1>ClinicOS</h1>
      <p>AI-powered clinic &amp; hospital management</p>
    </div>
    <div class="demo-banner">Demo build &mdash; sample data only. Nothing leaves this device.</div>
    <div class="field">
      <label>I am a</label>
      <div class="role-pick">
        <button type="button" class="role-opt sel" id="roleDoctor" onclick="pickRole('doctor')">
          <div class="ic">&#x1F468;&#x200D;&#x2695;&#xFE0F;</div><div class="t">Doctor</div>
        </button>
        <button type="button" class="role-opt" id="roleRecep" onclick="pickRole('receptionist')">
          <div class="ic">&#x1F469;&#x200D;&#x1F4BB;</div><div class="t">Receptionist</div>
        </button>
      </div>
    </div>
    <div class="field">
      <label>Branch</label>
      <select id="loginBranch"></select>
    </div>
    <div class="field">
      <label>Demo PIN (any 4 digits)</label>
      <input id="loginPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"
        onkeydown="if(event.key==='Enter')doLogin()"
        oninput="this.classList.remove('invalid');document.getElementById('pinErr').style.display='none'">
      <div class="err" id="pinErr" style="display:none">Enter any 4-digit PIN to continue.</div>
    </div>
    <button class="btn" onclick="doLogin()">Sign in securely</button>
    <p style="text-align:center;color:var(--muted);font-size:12px;margin-top:12px;">
      Role-based access &bull; every action is audit-logged
    </p>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appView">
  <div class="topbar">
    <div class="bmark">+</div>
    <div class="clinic"><span id="tbClinic">ClinicOS</span><small id="tbBranch"></small></div>
    <div class="spacer"></div>
    <span class="role-badge" id="tbRole"></span>
    <button class="btn sm ghost" onclick="switchBranch()" title="Switch branch">&#x1F504;</button>
    <button class="btn sm ghost" onclick="doLogout()" title="Sign out">&#x23FB;</button>
  </div>

  <div class="layout">
    <aside class="sidebar"><nav class="nav" id="sideNav"></nav></aside>
    <main class="main" id="view"></main>
  </div>

  <div class="bottomnav"><div class="row" id="bottomNav"></div></div>
  <div class="sheet-veil" id="sheetVeil" onclick="closeSheet()"></div>
  <div class="sheet" id="moreSheet"></div>
</div>

<div class="modal-veil" id="modalVeil" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>
<div id="toasts"></div>

<script>

/* ---------------- Data layer ---------------- */
let DB=null;
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){} }
function load(){
  try{ const raw=localStorage.getItem(DB_KEY); if(raw){ DB=JSON.parse(raw); ensureSettings(); return; } }catch(e){}
  DB=seedData(); ensureSettings(); save();
}
function audit(action, entity){
  DB.auditLog.unshift({ts:nowStr(), user:DB.session?DB.session.role:"system",
    role:DB.session?DB.session.role:"-", action, entity:entity||"-"});
  if(DB.auditLog.length>300) DB.auditLog.length=300;
}
function nowStr(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function todayStr(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()}`; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function inr(n){ return "\u20B9"+Number(n).toLocaleString("en-IN"); }
function patientById(id){ return DB.patients.find(p=>p.id===id); }
function branchTokens(bid){ return DB.tokens.filter(t=>t.branchId===bid).sort((a,b)=>a.num-b.num); }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.getElementById("toasts").appendChild(t); setTimeout(()=>t.remove(),2400); }
function openModal(html){ document.getElementById("modalBox").innerHTML=html;
  document.getElementById("modalVeil").classList.add("open");
  const f=document.querySelector("#modalBox input,#modalBox select,#modalBox button"); if(f) f.focus(); }
function closeModal(){ document.getElementById("modalVeil").classList.remove("open"); }

/* Global keyboard support: Esc dismisses overlays; Enter/Space activates keyboard-focusable rows */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeModal(); closeSheet(); return; }
  const t=e.target;
  if((e.key==="Enter"||e.key===" ")&&t&&t.classList&&t.classList.contains("prow")&&t.hasAttribute("data-kb")){
    e.preventDefault(); t.click(); }
});

/* ---------------- Queue ---------------- */
function vQueue(v){
  const bid=DB.session.branchId, toks=branchTokens(bid);
  const eta=i=>Math.max(0,(i)*AVG_CONSULT_MIN);
  let wi=0;
  const rows=toks.map(t=>{const p=patientById(t.patientId);
    const w=t.status==="waiting"?`<span class="sub"> · ~${eta(wi++)} min wait</span>`:"";
    return `<div class="token"><div class="num">${t.num}</div>
    <div class="who"><div class="nm">${esc(p.name)} <span class="sub">${p.age}${p.sex}</span></div>
      <div class="sub">${esc(p.village)} · ${t.type}${w}</div></div>
    <span class="pill ${t.status}">${t.status.replace("-"," ")}</span>
    <div class="btnrow">
      ${t.status==="waiting"?`<button class="btn sm" onclick="callNext('${t.id}')">Call</button>`:""}
      ${t.status==="in-consultation"?`<button class="btn sm secondary" onclick="startConsult('${t.id}')">Consult</button>`:""}
      ${t.status!=="done"?`<button class="btn sm ghost" onclick="doneToken('${t.id}')">Done</button>`:""}
    </div></div>`;}).join("");
  v.innerHTML=`<div class="pagehead"><h2>Token queue</h2>
    <button class="btn sm" onclick="addToken()">+ Walk-in token</button></div>
    ${rows||'<div class="card"><p style="color:var(--muted)">No tokens yet today.</p></div>'}
    <div class="notice">Queue Optimizer estimates ~${AVG_CONSULT_MIN} min per consultation and updates ETAs live.</div>`;
}
function addToken(){
  const opts=DB.patients.map(p=>`<option value="${p.id}">${esc(p.name)} — ${p.age}${p.sex}, ${esc(p.village)}</option>`).join("");
  openModal(`<h3>New walk-in token</h3>
    <div class="field"><label>Patient</label><select id="ntP">${opts}</select></div>
    <div class="btnrow"><button class="btn" onclick="doAddToken()">Issue token</button>
    <button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
}
function doAddToken(){
  const bid=DB.session.branchId, pid=document.getElementById("ntP").value;
  const num=DB.tokenSeq[bid]++;
  const t={id:"t"+Date.now(),num,patientId:pid,branchId:bid,status:"waiting",type:"walk-in",arrived:0};
  DB.tokens.push(t); audit("Token issued","#"+num+" "+patientById(pid).name);
  feed("queue","Token #"+num+" issued for "+patientById(pid).name+" — ETAs refreshed"); save(); closeModal(); render();
  toast("Token #"+num+" issued — WhatsApp confirmation queued (demo)");
}
function callNext(id){ const t=DB.tokens.find(x=>x.id===id); if(!t) return;
  DB.tokens.forEach(x=>{ if(x.branchId===t.branchId&&x.status==="in-consultation") x.status="waiting"; });
  t.status="in-consultation"; audit("Token called","#"+t.num);
  feed("queue","Token #"+t.num+" called — patient notified (demo)"); save(); render();
  toast("Token #"+t.num+" called — patient notified on WhatsApp (demo)"); }
function doneToken(id){ const t=DB.tokens.find(x=>x.id===id); if(!t) return;
  t.status="done"; audit("Token completed","#"+t.num); save(); render(); }

function addDays(ds,n){ const [d,m,y]=ds.split("-").map(Number); const dt=new Date(y,m-1,d+n);

let rec=null,recOn=false,recLang="hi-IN";

function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("Voice not supported in this browser — type instead"); return; }
  if(recOn){ rec.stop(); return; }
  rec=new SR(); rec.lang=recLang; rec.interimResults=false;
  rec.onresult=e=>{ const t=e.results[0][0].transcript; const ta=document.getElementById("cxTranscript");
    ta.value=(ta.value+" "+t).trim(); };
  rec.onend=()=>{recOn=false;updMic();}; rec.onerror=()=>{recOn=false;updMic();toast("Mic unavailable — check permission");};
  try{ rec.start(); recOn=true; updMic(); }catch(e){ toast("Could not start mic"); }
}
function updMic(){ const b=document.getElementById("micBtn"); if(b){ b.textContent=recOn?"⏹ Stop":"🎤 Dictate"; b.classList.toggle("danger",recOn);} }

function runScribe(){
  const t=document.getElementById("cxTranscript").value; CX.transcript=t;
  const tl=" "+t.toLowerCase()+" ";
  const found=[]; KW.forEach(function(kv){ if(tl.indexOf(kv[0])>-1&&found.indexOf(kv[1])===-1) found.push(kv[1]); });
  CX.complaints=found.join(", ");
  CX.diagnosis=DXMAP[found.slice(0,2).join(", ")]||DXMAP[found[0]]||"";
  let days=5; const dm=tl.match(/(\d+)\s*(din|days?)/); if(dm) days=parseInt(dm[1],10);
  CX.rows=[];
  DB.drugs.forEach(d=>{ const key=d.name.split(" ")[0].toLowerCase();
    if(tl.indexOf(" "+key+" ")>-1||tl.indexOf(" "+key+",")>-1||tl.indexOf(" "+key+".")>-1)
      CX.rows.push({name:d.name,freq:d.dose,days}); });
  CX.scribed=true; feed("scribe","Scribe drafted prescription from visit notes — awaiting doctor review"); render(); toast("Scribe drafted the prescription — review before saving");
}

function checkSafety(rows,p){
  const warns=[], names=rows.map(r=>r.name);
  INTERACTIONS.forEach(ix=>{ if(names.some(n=>n.indexOf(ix.a)>-1)&&names.some(n=>n.indexOf(ix.b)>-1)) warns.push(ix); });
  const alg=(p.allergies||"").toLowerCase();
  ALLERGY_X.forEach(ax=>{ if(ax.drugs.length&&alg.indexOf(ax.allergy)>-1)
    ax.drugs.forEach(d=>{ if(names.some(n=>n.indexOf(d)>-1)) warns.push(ax); }); });
  return warns;
}
function safetyHTML(){
  const rows=CX.rows&&CX.rows.length?CX.rows:readRowsSafe();

  if(!warns.length) return `<div class="notice">✓ Safety Checker: no interactions or allergy conflicts found. (Demo rule set — production uses clinical databases.)</div>`;
  return warns.map(w=>`<div class="warn ${w.sev==="amber"?"amber":""}">⚠ <b>${w.sev==="red"?"STOP — ":"Caution: "}</b>${esc(w.msg)}</div>`).join("");
}

  DB.visits.push({id:"v"+Date.now(),patientId:p.id,branchId:bid,date:todayStr(),

  feed("reminder","Prescription-ready WhatsApp queued for "+p.name+" (demo)");

function fauxQR(seed){
  let h=2166136261; for(const c of seed){ h^=c.codePointAt(0); h=Math.imul(h,16777619); }

  let cells=""; for(let i=0;i<441;i++) cells+=`<span style="background:${rnd()>0.52?"#14332f":"#ffffff"}"></span>`;
  return `<div style="display:inline-block;background:#fff;padding:10px;border-radius:10px;box-shadow:var(--shadow)">

function drawRevChart(){
  const c=document.getElementById("revChart"); if(!c) return;
  const days=repDates();
  const rev=days.map(d=>DB.bills.filter(b=>b.paid&&b.date===d).reduce((s,b)=>s+b.items.reduce((a,i)=>a+i[1],0),0));
  const ctx=c.getContext("2d"), W=c.width, H=c.height, pad=44;
  const max=Math.max.apply(null,rev.concat([1]));
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="#e2eae9"; ctx.fillStyle="#5f716e"; ctx.font="11px sans-serif"; ctx.textAlign="right";
  for(let g=0;g<=4;g++){ const y=pad+(H-pad-44)*g/4, val=Math.round(max*(4-g)/4);
    ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-10,y); ctx.stroke();
    ctx.fillText("\u20B9"+val.toLocaleString("en-IN"),pad-6,y+4); }
  const bw=(W-pad-20)/days.length;
  ctx.textAlign="center";
  days.forEach((d,i)=>{ const h=(H-pad-44)*rev[i]/max, x=pad+bw*i+bw*0.15, y=H-44-h;
    ctx.fillStyle="#0d9488"; ctx.fillRect(x,y,bw*0.7,Math.max(h,2));
    if(rev[i]>0){ ctx.fillStyle="#0b7c72"; ctx.fillText("\u20B9"+rev[i].toLocaleString("en-IN"),x+bw*0.35,y-6); }
    ctx.fillStyle="#5f716e"; ctx.fillText(d.slice(0,5),x+bw*0.35,H-24); });
}

       ${f.length?`<div style="margin-top:10px;font-size:13px"><b>Recent activity</b>${f.map(e=>`<div style="padding:6px 0;border-top:1px solid var(--line)"><span style="color:var(--muted);font-size:11.5px">${esc(e.ts)}</span><br>${esc(e.text)}</div>`).join("")}</div>`:""}
     </div></div></div>`;}).join("")}
  <p style="font-size:12px;color:var(--muted)">Demo agents run on-device rules. Production agents run medical LLMs with doctor review on every clinical output.</p>`;
}
function agentToggle(id){ DB.settings.agents[id]=!DB.settings.agents[id];
  audit("Agent "+(DB.settings.agents[id]?"enabled":"paused"),id); save(); render();
  toast("Agent "+(DB.settings.agents[id]?"enabled":"paused")); }

/* ---------------- Security & Audit (Phase 4, doctor only) ---------------- */
const PERMS=[
 ["Consult & prescribe",1,0],["Collect payments",1,1],["Register patients",1,1],
 ["Send WhatsApp messages",1,1],["View reports",1,1],["Switch branches",1,1],
 ["Change settings & fees",1,0],["View audit log",1,0]
];
function vSecurity(v){
  if(!needDoctor()) return;
  const s=DB.session, log=DB.auditLog.slice(0,60);
  v.innerHTML=`<div class="pagehead"><h2>Security & Audit</h2><span class="pill done">Doctor only</span></div>
  <div class="card"><h3>Current session</h3>
   <table class="log"><tr><th>Signed in as</th><th>Branch</th><th>Since</th></tr>
   <tr><td>${esc(s.role)}</td><td>${esc(branchName(s.branchId))}</td><td>${esc(s.at)}</td></tr></table></div>
  <div class="card"><h3>Role permissions</h3>
   <table class="log"><tr><th>Action</th><th>Doctor</th><th>Receptionist</th></tr>
   ${PERMS.map(p=>`<tr><td>${p[0]}</td><td>${p[1]?"\u2713":"\u2014"}</td><td>${p[2]?"\u2713":"\u2014"}</td></tr>`).join("")}</table>
   <p style="font-size:12px;color:var(--muted)">Clinical actions (consult, settings, audit) need a doctor sign-in. Receptionists handle queue, billing, WhatsApp and registration.</p></div>
  <div class="card"><h3>Audit log <span style="font-size:12px;color:var(--muted);font-weight:400">\u2014 every action, newest first</span></h3>
   ${log.length?`<div class="tablewrap" style="max-height:320px;overflow:auto"><table class="log"><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr>
   ${log.map(e=>`<tr><td style="white-space:nowrap">${esc(e.ts)}</td><td>${esc(e.user)}</td><td>${esc(e.action)}</td><td>${esc(e.entity)}</td></tr>`).join("")}</table></div>`
   :'<p style="color:var(--muted)">No entries yet.</p>'}</div>
  <div class="card"><h3>Backup & data safety</h3><div class="btnrow">
    <button class="btn sm ghost" onclick="exportData()">Export backup</button>
    <button class="btn sm ghost" onclick="document.getElementById('impFile2').click()">Import</button>
    <input type="file" id="impFile2" accept="application/json" style="display:none" onchange="importData(event)">
    <button class="btn sm danger" onclick="resetData()">Reset demo</button></div>
   <div class="err imp-err" style="display:none"></div>
   <div class="notice" style="margin-top:10px">Demo data safety: everything lives in this browser's localStorage. Nothing is uploaded anywhere \u2014 backups download as a file to this device.</div></div>`;
}

/* ---------------- Settings (Phase 4, doctor only) ---------------- */
let SET_BID="";
function vSettings(v){
  if(!needDoctor()) return;
  const s=DB.settings, bid=SET_BID||DB.session.branchId; SET_BID=bid;
  const b=DB.branches.find(x=>x.id===bid);
  v.innerHTML=`<div class="pagehead"><h2>Settings</h2><span class="pill done">Doctor only</span></div>
  <div class="card"><h3>Clinic profile</h3>
   <div class="field"><label>Branch</label><select id="setBid" onchange="SET_BID=this.value;render()">
     ${DB.branches.map(x=>`<option value="${x.id}" ${x.id===bid?"selected":""}>${esc(x.name)} \u2014 ${esc(x.area)}</option>`).join("")}</select></div>
   <div class="grid2" style="gap:10px">
    <div class="field"><label>Clinic name</label><input id="setBName" value="${esc(b.name)}"></div>
    <div class="field"><label>Area</label><input id="setBArea" value="${esc(b.area)}"></div>
    <div class="field"><label>Phone</label><input id="setBPhone" value="${esc(b.phone)}"></div>
    <div class="field"><label>Consultation fee (\u20B9)</label><input id="setFee" type="number" min="0" value="${DB.fees[bid]||300}"></div>
   </div>
   <div class="btnrow"><button class="btn sm" onclick="saveBranchProfile()">Save clinic profile</button></div></div>
  <div class="card"><h3>Doctor profile</h3>
   <div class="field"><label>Doctor name</label><input id="setDoc" value="${esc(s.doctorName)}"></div>
   <div class="btnrow"><button class="btn sm" onclick="saveDoctorProfile()">Save</button></div></div>
  <div class="card"><h3>Messaging & print</h3>
   <div class="field"><label>Default WhatsApp language</label><div class="btnrow">
     <button class="btn sm ${s.waLang==="hi"?"":"ghost"}" onclick="setWaLang('hi')">\u0939\u093F\u0902\u0926\u0940</button>
     <button class="btn sm ${s.waLang==="en"?"":"ghost"}" onclick="setWaLang('en')">English</button></div>
     <p style="font-size:12px;color:var(--muted)">Applies to WhatsApp templates in the WhatsApp Center.</p></div>
   <div class="field"><label>Print header text (receipts)</label><input id="setPrint" value="${esc(s.printHeader)}" placeholder="e.g. Sharma Clinic \u2014 caring since 1998"></div>
   <div class="btnrow"><button class="btn sm" onclick="savePrintPref()">Save</button></div></div>
  <div class="card"><h3>Notifications</h3>
   ${[["tokenConfirm","Token confirmations on WhatsApp"],["followupRemind","Follow-up reminders"],["dailySummary","Daily summary to doctor"]].map(n=>`
    <label style="display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px">
     <input type="checkbox" id="ntf_${n[0]}" ${s.notif[n[0]]?"checked":""} style="width:18px;height:18px;accent-color:var(--teal)"> ${n[1]}</label>`).join("")}
   <div class="btnrow" style="margin-top:8px"><button class="btn sm" onclick="saveNotif()">Save preferences</button></div></div>`;
}
function saveBranchProfile(){ const bid=SET_BID||DB.session.branchId, b=DB.branches.find(x=>x.id===bid);
  b.name=document.getElementById("setBName").value.trim()||b.name;
  b.area=document.getElementById("setBArea").value.trim()||b.area;
  b.phone=document.getElementById("setBPhone").value.trim()||b.phone;
  DB.fees[bid]=Math.max(0,parseInt(document.getElementById("setFee").value,10)||0);
  audit("Settings updated","clinic profile @ "+b.name); save(); render(); toast("Clinic profile saved"); }
function saveDoctorProfile(){ DB.settings.doctorName=document.getElementById("setDoc").value.trim()||"Dr. Sharma";
  audit("Settings updated","doctor profile"); save(); render(); toast("Doctor profile saved"); }
function setWaLang(l){ DB.settings.waLang=l; audit("Settings updated","WhatsApp language \u2192 "+l); save(); render(); }
function savePrintPref(){ DB.settings.printHeader=document.getElementById("setPrint").value.trim();
  audit("Settings updated","print header"); save(); render(); toast("Print preference saved"); }
function saveNotif(){ ["tokenConfirm","followupRemind","dailySummary"].forEach(k=>{ DB.settings.notif[k]=document.getElementById("ntf_"+k).checked; });
  audit("Settings updated","notification preferences"); save(); render(); toast("Preferences saved"); }

/* ---------------- Init ---------------- */
load();
document.getElementById("loginBranch").innerHTML=
  DB.branches.map(b=>`<option value="${b.id}">${esc(b.name)} — ${esc(b.area)}</option>`).join("");
</script>
</body>
</html>
